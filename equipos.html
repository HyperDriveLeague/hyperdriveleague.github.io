<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Equipos | HyperDrive League
    </title>


    <!-- ========================================
         ICONOS / APP
    ======================================== -->

    <link
        rel="icon"
        type="image/jpeg"
        href="images/logo/favicon.jpg"
    >

    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="images/logo/apple-touch-icon.png"
    >

    <link
        rel="manifest"
        href="manifest.webmanifest"
    >

    <meta
        name="theme-color"
        content="#080808"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="HyperDrive"
    >


    <!-- ========================================
         CSS
    ======================================== -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/equipos.css"
    >

</head>


<body>


    <div id="site-header"></div>



    <!-- ========================================
         EQUIPOS
    ======================================== -->

    <main class="teams-page">


        <!-- ========================================
             HERO
        ======================================== -->

        <section class="teams-hero">

            <div class="teams-hero-content">

                <span class="teams-hero-label">
                    HYPERDRIVE LEAGUE · SEASON 8
                </span>

                <h1>
                    EQUIPOS
                </h1>

                <p>
                    Descubre las 11 escuderías que forman la parrilla
                    de HyperDrive League, sus Team Principals
                    y sus alineaciones oficiales en HyperDrive y Academy.
                </p>

            </div>

        </section>



        <!-- ========================================
             CONTENIDO
        ======================================== -->

        <section class="teams-content">


            <div class="teams-heading">

                <div>

                    <span class="teams-heading-label">
                        PARRILLA OFICIAL
                    </span>

                    <h2>
                        LAS 11 ESCUDERÍAS
                    </h2>

                </div>


                <div class="teams-heading-info">

                    <span>
                        TEAM PRINCIPAL
                    </span>

                    <span>
                        ·
                    </span>

                    <span>
                        HYPERDRIVE
                    </span>

                    <span>
                        ·
                    </span>

                    <span>
                        ACADEMY
                    </span>

                </div>

            </div>



            <!-- ========================================
                 EQUIPOS GENERADOS POR JAVASCRIPT
            ======================================== -->

            <div
                class="teams-grid"
                id="teams-grid"
            >

                <div class="teams-loading">
                    CARGANDO EQUIPOS...
                </div>

            </div>


        </section>


    </main>



    <div id="site-footer"></div>



    <!-- ========================================
         JAVASCRIPT
    ======================================== -->

    <script src="js/layout.js"></script>
    <script src="js/main.js"></script>
    <script src="js/equipos.js"></script>


</body>

</html>
