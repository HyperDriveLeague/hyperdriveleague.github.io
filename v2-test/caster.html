<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Caster | HyperDrive</title><link rel="stylesheet" href="css/app.css?v=6"><main class="app-shell"><header class="module-header"><h1>Caster</h1><a href="index.html">← Área privada</a></header><p id="status">Comprobando permisos…</p><section id="modules" hidden><a class="access-card module-card module-anchor" style="border:1px solid #d4af37;color:#d4af37" href="caster-awards.html"><h3>GALA DE PREMIOS</h3><p>HyperDrive Awards · Temporada 8</p><span>ABRIR PRESENTACIÓN →</span></a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script><script src="js/config.js?v=5"></script><script>(async()=>{const c=window.HYPERDRIVE_CONFIG,d=window.supabase.createClient(c.supabaseUrl,c.supabasePublishableKey),s=document.getElementById('status');try{const u=await d.auth.getUser();if(!u.data.user){location.replace('index.html');return}const r=await d.from('user_roles').select('role').eq('user_id',u.data.user.id);if(r.error||!r.data.some(x=>['caster','admin'].includes(x.role)))throw Error('Acceso restringido');s.hidden=true;document.getElementById('modules').hidden=false}catch(e){s.textContent=e.message}})()</script></html>
