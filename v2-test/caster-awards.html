(async()=>{const cfg=window.HYPERDRIVE_CONFIG,db=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),setup=document.getElementById('setup'),scene=document.getElementById('scene');const el=(tag,txt,cls)=>{let e=document.createElement(tag);e.textContent=txt||'';if(cls)e.className=cls;return e};const photos=["images/drivers/DanielCarmona.png","images/drivers/Iker.png","images/drivers/alexlamas.png","images/drivers/alvarosn94.png","images/drivers/blackstorm.png","images/drivers/cachii.png","images/drivers/carascari.png","images/drivers/carlesvelasco.png","images/drivers/darkzhadow.png","images/drivers/diablorojo.png","images/drivers/eriknight.png","images/drivers/extor.png","images/drivers/german.png","images/drivers/granboss.png","images/drivers/iker.png","images/drivers/imulero.png","images/drivers/ironser.png","images/drivers/ivanition.png","images/drivers/jaime.png","images/drivers/juanantonio.png","images/drivers/kevin.png","images/drivers/kiko.png","images/drivers/kolakao.png","images/drivers/kongol.png","images/drivers/laxavineta.png","images/drivers/lewton.png","images/drivers/luis.png","images/drivers/manutlv.png","images/drivers/martinez93.png","images/drivers/matahary.png","images/drivers/ojerez.png","images/drivers/pedro.png","images/drivers/pelitallica.png","images/drivers/pereira.png","images/drivers/pini.png","images/drivers/raul.png","images/drivers/ricardet88.png","images/drivers/rjerez.png","images/drivers/sebitas.png","images/drivers/sergi.png","images/drivers/sergi6gm.png","images/drivers/sergimarquez.png","images/drivers/serginho.png","images/drivers/sincdex.png","images/drivers/soccerllanos.png","images/drivers/sunsurfer.png","images/drivers/tongolikki.png","images/drivers/toni.png","images/drivers/venegas.png","images/drivers/victor.png","images/drivers/vrister.png","images/drivers/yohan.png","images/drivers/zanfer.png","images/drivers/zarba.png"],norm=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,''),photoFor=n=>{let k=norm(n.nickname),p=photos.find(p=>norm(p.split('/').pop().replace(/\.png$/i,''))===k);return p?'https://hyperdriveleague.github.io/'+p:''};let steps=[],i=0,categories=[],winners=new Map();function title(t){scene.append(el('small','HYPERDRIVE AWARDS · TEMPORADA 8','enter'),el('h1',t,'enter'))}function render(){const s=steps[i];if(s.kind==='winner'&&scene.dataset.category===String(s.c.id)){const cards=[...scene.querySelectorAll('.nominee')];const win=cards.find(x=>x.dataset.id===winners.get(s.c.id));if(win){const shift=scene.getBoundingClientRect().left+scene.offsetWidth/2-(win.getBoundingClientRect().left+win.offsetWidth/2);win.style.setProperty('--shift',shift+'px');cards.forEach(x=>x.classList.add(x===win?'winner':'loser'));return}}scene.replaceChildren();scene.dataset.category='';if(s.kind==='intro'){title('HYPERDRIVE AWARDS');scene.append(el('h2','TEMPORADA 8','enter'))}else if(s.kind==='list'){title('CATEGORÍAS');let g=el('div','','categories');categories.forEach((c,j)=>{let x=el('div',c.name,'enter');x.style.setProperty('--delay',j*.32+'s');g.append(x)});scene.append(g)}else if(s.kind==='end'){title('GRACIAS POR ACOMPAÑARNOS')}else if(s.kind==='title'){title(s.c.name)}else{scene.dataset.category=String(s.c.id);scene.append(el('h2',s.c.name,'enter'));let g=el('div','','nominees');s.c.ns.forEach((n,j)=>{let x=el('div','','nominee');x.dataset.id=n.id;x.style.setProperty('--w',Math.min(23,90/s.c.ns.length)+'%');let inner=el('div','','enter');inner.style.setProperty('--delay',j*.65+'s');let im=el('img');im.alt=n.nickname||'Piloto';let fallback=photoFor(n);let avatar=n.avatar_url;let urls=[fallback,avatar?new URL(avatar,'https://hyperdriveleague.github.io/').href:''].filter(Boolean);let attempt=0;im.onerror=()=>{if(++attempt<urls.length)im.src=urls[attempt];else im.replaceWith(el('div','Sin fotografía','placeholder'))};if(urls.length){im.src=urls[0];inner.append(im)}else inner.append(el('div','Sin fotografía','placeholder'));inner.append(el('strong',n.nickname),el('span',n.team));x.append(inner);g.append(x)});scene.append(g);if(s.kind==='winner'){scene.dataset.category=String(s.c.id);requestAnimationFrame(()=>{if(steps[i]===s)render()})}}}try{let u=await db.auth.getUser();if(!u.data.user)throw Error('Inicia sesión primero.');let r=await db.from('user_roles').select('role').eq('user_id',u.data.user.id);if(r.error||!r.data.some(x=>['caster','admin'].includes(x.role)))throw Error('Acceso reservado a Caster y Administración.');let results=await Promise.all([db.from('awards_categories').select('*').eq('season_number',8).order('id'),db.from('awards_nominees').select('*'),db.from('drivers').select('id,nickname,avatar_url'),db.from('season_roster').select('driver_id,teams:team_id(name)').eq('season_number',8).eq('is_active',true)]);for(let x of results)if(x.error)throw x.error;let [cs,ns,ds,rs]=results.map(x=>x.data);categories=cs.map(c=>({...c,ns:ns.filter(n=>n.category_id===c.id).map(n=>({...ds.find(d=>d.id===n.driver_id),id:n.driver_id,team:rs.find(r=>r.driver_id===n.driver_id)?.teams?.name||'Sin escudería'}))}));if(!categories.length)categories=[{id:'demo-1',name:'Piloto de la temporada',ns:[]},{id:'demo-2',name:'Piloto revelación',ns:[]}];setup.replaceChildren(el('h2','Preparar gala'),el('p','Selecciona los ganadores confirmados antes de iniciar. Esta selección no modifica las votaciones.'));categories.forEach(c=>{let l=el('label',c.name),s=el('select');s.append(new Option('Seleccionar ganador',''));c.ns.forEach(n=>s.append(new Option(n.nickname,n.id)));s.onchange=()=>winners.set(c.id,s.value);l.append(s);setup.append(l)});let b=el('button','Iniciar presentación');setup.append(b);b.onclick=()=>{if(categories.some(c=>!winners.get(c.id))){alert('Selecciona todos los ganadores.');return}steps=[{kind:'intro'},{kind:'list'},...categories.flatMap(c=>['title','nominees','winner'].map(kind=>({kind,c}))),{kind:'end'}];setup.hidden=true;scene.hidden=false;document.getElementById('presenters').
