<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>HyperDrive Awards T8</title><style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#f8e6b5;font-family:Arial,sans-serif;overflow:hidden;display:grid;place-items:center;height:100dvh}#stage{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;overflow:hidden;background:radial-gradient(ellipse,#302010,#080808 70%);display:grid;place-items:center;text-align:center}#stage:before{content:'';position:absolute;inset:-100%;background:linear-gradient(115deg,transparent 44%,#d7a74a22 48%,#ffdb802b 50%,transparent 54%);animation:sweep 12s linear infinite;pointer-events:none}@keyframes sweep{from{transform:translateX(-35%)}to{transform:translateX(35%)}}#scene{position:relative;width:90%;z-index:1}h1{font-size:clamp(22px,5vw,95px);margin:.3em 0;color:#f6d58a;text-shadow:0 0 30px #a77736}h2{font-size:clamp(15px,2.5vw,48px)}small{letter-spacing:.3em} .enter{animation:fade .65s both;animation-delay:var(--delay,0s)}@keyframes fade{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}.categories{display:grid;grid-template-columns:repeat(2,1fr);gap:.65em;font-size:clamp(12px,1.7vw,30px)}.nominees{position:relative;height: min(42vw,70vh);display:flex;justify-content:center;align-items:center;gap:1.2%;}.nominee{width:var(--w);max-width:24%;transition:transform 1s,opacity .7s,filter 1s;position:relative;background:#18140e;border:1px solid #9e783d;padding:1%;border-radius:8px;flex-shrink:0}.nominee img,.placeholder{width:100%;aspect-ratio:3/4;object-fit:contain;background:#111}.nominee strong,.nominee span{display:block;font-size:clamp(10px,1.5vw,25px)}.nominee span{font-size:clamp(9px,1vw,18px);color:#c7b68d}.nominee.loser{opacity:0}.nominee.winner{z-index:3;transform:translateX(var(--shift)) scale(1.22);filter:drop-shadow(0 0 24px #e9b84e);border-color:#ffe4a0}.nominee.winner:after{content:'GANADOR';display:block;color:#ffe6a5;font-weight:bold;margin-top:.5em}#setup{position:absolute;z-index:5;background:#16130e;padding:2rem;max-height:90vh;overflow:auto;width:min(700px,95vw)}label{display:block;margin:12px 0}select,button{background:#292117;color:#f8e6b5;padding:10px;border:1px solid #9e783d;border-radius:5px}select{width:100%}#setup[hidden]{display:none}#scene[hidden]{display:none}
</style><main id="stage"><div id="scene" hidden></div></main><section id="setup">Comprobando permisos…</section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script><script src="js/config.js?v=5"></script><script>
(async()=>{const cfg=window.HYPERDRIVE_CONFIG,db=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),setup=document.getElementById('setup'),scene=document.getElementById('scene');const el=(tag,txt,cls)=>{let e=document.createElement(tag);e.textContent=txt||'';if(cls)e.className=cls;return e};let steps=[],i=0,categories=[],winners=new Map();function title(t){scene.append(el('small','HYPERDRIVE AWARDS · TEMPORADA 8','enter'),el('h1',t,'enter'))}function render(){const s=steps[i];if(s.kind==='winner'&&scene.dataset.category===String(s.c.id)){const cards=[...scene.querySelectorAll('.nominee')];const win=cards.find(x=>x.dataset.id===winners.get(s.c.id));if(win){const shift=scene.getBoundingClientRect().left+scene.offsetWidth/2-(win.getBoundingClientRect().left+win.offsetWidth/2);win.style.setProperty('--shift',shift+'px');cards.forEach(x=>x.classList.add(x===win?'winner':'loser'));return}}scene.replaceChildren();scene.dataset.category='';if(s.kind==='intro'){title('HYPERDRIVE AWARDS');scene.append(el('h2','TEMPORADA 8','enter'))}else if(s.kind==='list'){title('CATEGORÍAS');let g=el('div','','categories');categories.forEach((c,j)=>{let x=el('div',c.name,'enter');x.style.setProperty('--delay',j*.12+'s');g.append(x)});scene.append(g)}else if(s.kind==='end'){title('GRACIAS POR ACOMPAÑARNOS')}else if(s.kind==='title'){title(s.c.name)}else{scene.dataset.category=String(s.c.id);scene.append(el('h2',s.c.name,'enter'));let g=el('div','','nominees');s.c.ns.forEach((n,j)=>{let x=el('div','','nominee');x.dataset.id=n.id;x.style.setProperty('--w',Math.min(23,90/s.c.ns.length)+'%');let inner=el('div','','enter');inner.style.setProperty('--delay',j*.18+'s');if(/^https:\/\//i.test(n.avatar_url||'')){let im=el('img');im.src=n.avatar_url;im.alt='';inner.append(im)}else inner.append(el('div','','placeholder'));inner.append(el('strong',n.nickname),el('span',n.team));x.append(inner);g.append(x)});scene.append(g);if(s.kind==='winner'){scene.dataset.category=String(s.c.id);requestAnimationFrame(()=>{if(steps[i]===s)render()})}}}try{let u=await db.auth.getUser();if(!u.data.user)throw Error('Inicia sesión primero.');let r=await db.from('user_roles').select('role').eq('user_id',u.data.user.id);if(r.error||!r.data.some(x=>['caster','admin'].includes(x.role)))throw Error('Acceso reservado a Caster y Administración.');let results=await Promise.all([db.from('awards_categories').select('*').eq('season_number',8).order('id'),db.from('awards_nominees').select('*'),db.from('drivers').select('id,nickname,avatar_url'),db.from('season_roster').select('driver_id,teams:team_id(name)').eq('season_number',8).eq('is_active',true)]);for(let x of results)if(x.error)throw x.error;let [cs,ns,ds,rs]=results.map(x=>x.data);categories=cs.map(c=>({...c,ns:ns.filter(n=>n.category_id===c.id).map(n=>({...ds.find(d=>d.id===n.driver_id),id:n.driver_id,team:rs.find(r=>r.driver_id===n.driver_id)?.teams?.name||'Sin escudería'}))}));if(!categories.length)throw Error('No hay categorías.');setup.replaceChildren(el('h2','Preparar gala'),el('p','Selecciona los ganadores confirmados antes de iniciar. Esta selección no modifica las votaciones.'));categories.forEach(c=>{let l=el('label',c.name),s=el('select');s.append(new Option('Seleccionar ganador',''));c.ns.forEach(n=>s.append(new Option(n.nickname,n.id)));s.onchange=()=>winners.set(c.id,s.value);l.append(s);setup.append(l)});let b=el('button','Iniciar presentación');setup.append(b);b.onclick=()=>{if(categories.some(c=>!winners.get(c.id))){alert('Selecciona todos los ganadores.');return}steps=[{kind:'intro'},{kind:'list'},...categories.flatMap(c=>['title','nominees','winner'].map(kind=>({kind,c}))),{kind:'end'}];setup.hidden=true;scene.hidden=false;render();document.documentElement.requestFullscreen?.().catch(()=>{});};document.addEventListener('keydown',e=>{if(!setup.hidden||e.repeat)return;let next=i+(e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0);if(next!==i&&next>=0&&next<steps.length){e.preventDefault();i=next;render()}})}catch(e){setup.textContent=e.message}})();
</script></html>
