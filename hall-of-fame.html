<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Palmarés de pilotos · Hall of Fame | HyperDrive League
    </title>


    <!-- ========================================
         ICONOS / APP
    ======================================== -->

    <link
        rel="icon"
        type="image/jpeg"
        href="images/logo/favicon.jpg"
    >

    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="images/logo/apple-touch-icon.png"
    >

    <link
        rel="manifest"
        href="manifest.webmanifest"
    >

    <meta
        name="theme-color"
        content="#080808"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="HyperDrive"
    >


    <!-- ========================================
         CSS
    ======================================== -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/hall-of-fame.css?v=2"
    >

</head>


<body>


    <div id="site-header"></div>



    <!-- ========================================
         HALL OF FAME
    ======================================== -->

    <main class="hall-page">


        <section class="hall-hero">

            <div class="hall-hero-content">

                <span class="hall-hero-label">
                    HYPERDRIVE LEAGUE · HISTORIA
                </span>

                <h1>
                    HALL OF FAME
                </h1>

            </div>

        </section>



        <section class="records" aria-labelledby="records-title">
            <header class="records-heading">
                <div><p class="season-label">TEMPORADA 8</p><h2 id="records-title">Palmarés de pilotos</h2></div>
                <div class="division-switch" role="group" aria-label="División">
                    <button type="button" data-division="hyperdrive" aria-pressed="true">HyperDrive · Primera</button>
                    <button type="button" data-division="academy" aria-pressed="false">Academy · Segunda</button>
                </div>
            </header>
            <div class="records-tools">
                <label>Vista <select id="records-view">
                    <option value="summary">Resumen</option><option value="race">Carrera principal</option>
                    <option value="sprint">Sprint</option><option value="titles">Campeonatos</option>
                </select></label>
                <label>Buscar piloto <input id="records-search" type="search" placeholder="Nombre del piloto"></label>
            </div>
            <p id="records-status" role="status">Cargando resultados…</p>
            <div class="records-scroll" role="region" aria-label="Palmarés por piloto" tabindex="0">
                <table id="records-table" hidden><caption></caption><thead></thead><tbody></tbody></table>
            </div>
            <p id="records-note"></p>
        </section>

    </main>



    <div id="site-footer"></div>



    <!-- ========================================
         JAVASCRIPT
    ======================================== -->

    <script src="js/layout.js"></script>
    <script src="js/public-account.js?v=2"></script>
    <script src="js/f2-r6-adapter.js"></script>
    <script src="js/hall-of-fame.js"></script>
    <script src="js/main.js"></script>


</body>

</html>
