<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Campeonato | HyperDrive League
    </title>

    <link
        rel="icon"
        type="image/jpeg"
        href="images/logo/favicon.jpg"
    >

    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="images/logo/apple-touch-icon.png"
    >

    <link
        rel="manifest"
        href="manifest.webmanifest"
    >

    <meta
        name="theme-color"
        content="#080808"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="HyperDrive"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/campeonato.css"
    >

</head>


<body>


    <div id="site-header"></div>



    <!-- ========================================
         CAMPEONATO
    ======================================== -->

    <main class="championship-page">


        <section class="championship-hero">

            <div class="championship-hero-content">

                <span class="championship-label">
                    SEASON 8 · 2026
                </span>


                <h1>
                    CAMPEONATO
                </h1>


                <p>
                    Sigue la lucha por los títulos de pilotos,
                    constructores y superconstructores de
                    HyperDrive League.
                </p>

            </div>

        </section>



        <!-- ========================================
             SELECTOR
        ======================================== -->

        <section class="championship-content">


            <div class="championship-tabs">


                <!-- PILOTOS HYPERDRIVE -->

                <button
                    class="championship-tab active"
                    data-championship="hyperdrive"
                    type="button"
                >
                    HYPERDRIVE
                </button>


                <!-- PILOTOS ACADEMY -->

                <button
                    class="championship-tab"
                    data-championship="academy"
                    type="button"
                >
                    ACADEMY
                </button>


                <!-- CONSTRUCTORES HYPERDRIVE -->

                <button
                    class="championship-tab"
                    data-championship="constructors-hyperdrive"
                    type="button"
                >
                    CONSTRUCTORES HYPERDRIVE
                </button>


                <!-- CONSTRUCTORES ACADEMY -->

                <button
                    class="championship-tab"
                    data-championship="constructors-academy"
                    type="button"
                >
                    CONSTRUCTORES ACADEMY
                </button>


                <!-- SUPERCONSTRUCTORES -->

                <button
                    class="championship-tab"
                    data-championship="superconstructors"
                    type="button"
                >
                    SUPERCONSTRUCTORES
                </button>


            </div>



            <!-- ========================================
                 CLASIFICACIÓN
            ======================================== -->

            <div class="championship-table">


                <div class="championship-table-header">

                    <span>
                        POS
                    </span>

                    <span>
                        PILOTO
                    </span>

                    <span>
                        EQUIPO
                    </span>

                    <span>
                        PUNTOS
                    </span>

                </div>


                <div id="championship-list">

                    <div class="championship-loading">

                        CARGANDO CAMPEONATO...

                    </div>

                </div>


            </div>


        </section>


    </main>



    <div id="site-footer"></div>



    <!-- ========================================
         JAVASCRIPT
    ======================================== -->

    <script src="js/layout.js"></script>
    <script src="js/main.js"></script>
    <script src="js/campeonato.js"></script>


</body>

</html>
