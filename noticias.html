<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Noticias | HyperDrive League
    </title>

    <link
        rel="icon"
        type="image/jpeg"
        href="images/logo/favicon.jpg"
    >

    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="images/logo/apple-touch-icon.png"
    >

    <link
        rel="manifest"
        href="manifest.webmanifest"
    >

    <meta
        name="theme-color"
        content="#080808"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"

    >

    <meta

        content="HyperDrive"

    <link

        href="css/style.css"
    >

</head>


<body>


    <div id="site-header"></div>



    <!-- ========================================
         CONTENIDO
    ======================================== -->

    <main>

        <section class="news-page">


            <div class="news-page-heading">

                <span>
                    HYPERDRIVE LEAGUE
                </span>

                    NOTICIAS
                </h1>

                <p>
                    Toda la actualidad de HyperDrive, Academy,
                    pilotos, equipos, mercado y campeonato.
                </p>

            </div>



            <div
                class="news-page-grid"
                id="news-page-grid"

                <div class="news-loading">
                    CARGANDO NOTICIAS...
                </div>

            </div>


        </section>

    </main>



    <div id="site-footer"></div>



    <!-- ========================================
         JAVASCRIPT
    ======================================== -->

    <script src="js/layout.js"></script>

    <script src="js/news.js"></script>

</html>
