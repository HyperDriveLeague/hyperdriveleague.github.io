<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Resultados | HyperDrive League
    </title>

    <link
        rel="icon"
        type="image/jpeg"
        href="images/logo/favicon.jpg"
    >

    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="images/logo/apple-touch-icon.png"
    >

    <link
        rel="manifest"
        href="manifest.webmanifest"
    >

    <meta
        name="theme-color"
        content="#080808"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="HyperDrive"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/resultados.css"
    >

</head>


<body>


    <div id="site-header"></div>



    <!-- ========================================
         RESULTADOS
    ======================================== -->

    <main class="results-page">


        <section class="results-page-hero">

            <div class="results-page-hero-content">

                <span class="results-page-label">
                    SEASON 8 · 2026
                </span>

                <h1>
                    RESULTADOS
                </h1>

                <p>
                    Consulta los resultados completos de cada ronda
                    de HyperDrive y Academy, incluyendo carreras Sprint,
                    clasificación, estrategias y datos de cada piloto.
                </p>

            </div>

        </section>



        <section class="results-page-content">


            <!-- ========================================
                 DIVISIONES
            ======================================== -->

            <div class="results-page-tabs">

                <button
                    class="results-page-tab active"
                    data-results-page-division="hyperdrive"
                    type="button"
                >
                    HYPERDRIVE
                </button>

                <button
                    class="results-page-tab"
                    data-results-page-division="academy"
                    type="button"
                >
                    ACADEMY
                </button>

            </div>


            <!-- ========================================
                 RESULTADOS GENERADOS POR JAVASCRIPT
            ======================================== -->

            <div
                class="results-page-list"
                id="results-page-list"
            >

                <div class="results-page-loading">
                    CARGANDO RESULTADOS...
                </div>

            </div>


        </section>


    </main>



    <div id="site-footer"></div>



    <!-- ========================================
         JAVASCRIPT
    ======================================== -->

    <script src="js/layout.js"></script>
    <script src="js/main.js"></script>
    <script src="js/resultados.js"></script>


</body>

</html>
